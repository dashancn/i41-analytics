<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>i41 匿名统计服务</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172133;background:#f5f7fb}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:680px;padding:36px;border:1px solid #dbe3ef;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(30,48,80,.08)}.status{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#eaf9f1;color:#18794e;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#22a06b}h1{margin:22px 0 10px;font-size:32px}p{color:#5d687b;line-height:1.75}code{padding:2px 6px;border-radius:6px;background:#eef2f7}a{color:#246bfd}
  </style>
</head>
<body>
  <main class="card">
    <div class="status"><span class="dot"></span>服务运行正常</div>
    <h1>i41 匿名统计服务</h1>
    <p>用于汇总 i41 免费工具的页面访问、UTM 来源和跨站导航点击。统计采用固定白名单字段，不使用 Cookie，也不创建永久访客身份。</p>
    <p>不收集文件、用户输入或永久身份标识，包括图片、PDF、OCR 内容、文件名、剪贴板内容、密码、提取码和水印文字。</p>
    <p>健康检查：<a href="/health"><code>/health</code></a>　开源代码：<a href="https://github.com/dashancn/i41-analytics" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </main>
</body>
</html>
