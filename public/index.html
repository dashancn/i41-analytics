<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>i41 工具生态数据</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172133;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:36px 0 60px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.head-actions{display:flex;align-items:flex-start;gap:10px}.logout button{border:1px solid #dbe3ef;border-radius:10px;background:#fff;padding:9px 13px;color:#566176;cursor:pointer}.eyebrow{color:#246bfd;font-size:13px;font-weight:800;letter-spacing:.08em}h1{margin:7px 0;font-size:clamp(28px,5vw,46px)}.sub{margin:0;color:#697386}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{border:1px solid #dbe3ef;border-radius:10px;background:#fff;padding:9px 13px;color:#566176;cursor:pointer}.controls button.active{border-color:#246bfd;background:#246bfd;color:#fff}.status{display:flex;align-items:center;gap:8px;color:#18794e;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#22a06b}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.metric,.panel{border:1px solid #dfe6f0;border-radius:18px;background:#fff;box-shadow:0 9px 30px rgba(35,54,88,.06)}.metric{padding:20px}.metric span{display:block;color:#758095;font-size:13px}.metric strong{display:block;margin-top:8px;font-size:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:20px;min-width:0}.wide{grid-column:1/-1}.panel h2{margin:0 0 16px;font-size:18px}.bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:minmax(160px,300px) 1fr 50px;align-items:center;gap:10px;font-size:13px}.track{height:10px;border-radius:999px;background:#edf1f7;overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#246bfd,#77a3ff)}.value{text-align:right;font-weight:750}.trend{display:flex;align-items:end;gap:6px;height:180px;padding-top:18px}.day{display:flex;flex:1;height:100%;min-width:0;flex-direction:column;justify-content:end;align-items:center;gap:7px}.column{width:min(34px,80%);min-height:3px;border-radius:7px 7px 2px 2px;background:linear-gradient(#246bfd,#8ab0ff)}.day small{font-size:10px;color:#7b8597;white-space:nowrap}.empty{padding:24px;border-radius:12px;background:#f7f9fc;color:#768196;text-align:center}.foot{margin-top:20px;color:#6c778a;font-size:12px;line-height:1.7}.error{display:none;margin:16px 0;padding:13px;border-radius:12px;background:#fff0f0;color:#a33}.error.show{display:block}@media(max-width:760px){.head{flex-direction:column}.summary,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.bar-row{grid-template-columns:minmax(145px,1fr) 70px 36px}.shell{padding-top:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head"><div><div class="eyebrow">I41 ANALYTICS</div><h1>i41 工具生态数据</h1><p class="sub">匿名访问、UTM 来源与跨站导流汇总</p></div><div class="head-actions"><div><div class="controls" aria-label="统计时间范围"><button data-range="1d">今日</button><button class="active" data-range="7d">近 7 天</button><button data-range="30d">近 30 天</button></div><p class="status"><span class="dot"></span><span id="updated">正在读取数据…</span></p></div><form class="logout" method="post" action="/logout"><button type="submit">退出</button></form></div></header>
    <div id="error" class="error"></div>
    <section class="summary"><article class="metric"><span>页面访问</span><strong id="pageViews">—</strong></article><article class="metric"><span>前往 i方案</span><strong id="primaryClicks">—</strong></article><article class="metric"><span>工具间跳转</span><strong id="ecosystemClicks">—</strong></article></section>
    <section class="grid">
      <article class="panel"><h2>站点访问</h2><div id="sites" class="bars"></div></article>
      <article class="panel"><h2>i方案入口来源</h2><div id="sources" class="bars"></div></article>
      <article class="panel wide"><h2>访问趋势</h2><div id="trend" class="trend"></div></article>
      <article class="panel wide"><h2>跨站导流</h2><div id="outbound" class="bars"></div></article>
    </section>
    <p class="foot">数据来自 Workers Analytics Engine，仅展示聚合计数。不收集文件、用户输入或永久身份标识，包括图片、PDF、OCR 内容、文件名、剪贴板内容、密码、提取码和水印文字。页面每 60 秒自动刷新。</p>
  </main>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
